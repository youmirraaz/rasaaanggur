<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Rasaaanggur</title>
  <link rel="stylesheet" href="style.css"> 
  <script>
    // SATPAM: Kalau belum login, langsung tendang balik ke halaman login
    if (localStorage.getItem("isLoggedIn") !== "true") {
        window.location.href = "index.html";
    }
  </script>
</head>
<body>

  <div class="wrapper" style="width: 500px;">
    <h2>Selamat Datang Kembali!</h2>
    <h3 style="color: #ffcc00; margin-bottom: 20px; font-size: 1.5rem;">
      👋 Halo, <span id="userDisplay">Pengguna</span>
    </h3>
    
    <p style="color: #fff; margin-bottom: 30px; font-size: 0.95rem; line-height: 1.6;">
      Lo berhasil masuk! Nanti di bagian bawah sini bisa kita isi sama foto-foto produk rasa anggur lo yang lo maksud itu.
    </p>

    <button id="logoutBtn" style="background: #ff4d4d; color: #fff;">Keluar / Log Out</button>
  </div>

  <script>
    // Ambil nama user dari localStorage dan pajang di layar
    const savedUsername = localStorage.getItem("username");
    if (savedUsername) {
        document.getElementById("userDisplay").innerText = savedUsername;
    }

    // Fungsi Tombol Logout
    document.getElementById("logoutBtn").addEventListener("click", function() {
        localStorage.removeItem("isLoggedIn");
        localStorage.removeItem("username");
        window.location.href = "index.html"; // Balik ke halaman login
    });
  </script>
</body>
</html>
